  <style>
    /* =========================================================
       CORES DA MARCA — altere aqui para mudar o site inteiro
       ========================================================= */
    :root {
      --fundo:        #E9E8E8;  /* cinza claro da identidade */
      --bordo:        #8E0115;  /* bordô da logo */
      --linhas:       #CFA4AC;  /* rosa antigo das linhas e infinitos */
      --borda:        #C77A86;  /* bordas dos botões */
      --bloco:        #F4EFF0;  /* bloco claro atrás dos botões */
      --botao:        #FAF5F6;  /* fundo dos botões */
      --botao-hover:  #F1DDE1;  /* botão ao passar o mouse / tocar */

      --fonte-texto:  "Cormorant Garamond", Garamond, "Times New Roman", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--fundo);
      color: var(--bordo);
      font-family: var(--fonte-texto);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* =========================================================
       LINHAS ORGÂNICAS E INFINITOS (SVG fixo atrás do conteúdo)
       Há um desenho para celular e outro para computador.
       ========================================================= */
    .linhas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .linhas svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--linhas);
      stroke-linecap: round;
    }
    .grossa { stroke-width: 4; }
    .fina   { stroke-width: 2; }
    .linhas__pc { display: none; }

    /* =========================================================
       ESTRUTURA — MOBILE FIRST
       ========================================================= */
    .pagina {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px max(22px, env(safe-area-inset-right)) 28px max(22px, env(safe-area-inset-left));
      gap: 40px;
    }

    /* ---------- Logo (arquivo original, em imagem) ---------- */
    .marca { margin: 0; text-align: center; }
    .marca__logo { margin: 0; line-height: 0; }
    .marca img {
      display: block;
      width: min(290px, 80vw);
      height: auto;
      margin: 0 auto;
    }

    /* ---------- Bloco de botões ---------- */
    .links {
      width: 100%;
      max-width: 400px;
      background: var(--bloco);
      padding: 22px 18px 20px;
    }
    .links ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .botao {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 12px 16px;
      background: var(--botao);
      border: 1px solid var(--borda);
      border-radius: 0;
      color: var(--bordo);
      font-family: var(--fonte-texto);
      font-weight: 600;
      font-size: 22px;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .25s ease, border-color .25s ease;
    }
    .botao:hover,
    .botao:active { background: var(--botao-hover); border-color: var(--bordo); }
    .botao:focus-visible { outline: 1px solid var(--bordo); outline-offset: 3px; }

    /* ---------- Rodapé ---------- */
    .rodape {
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .rodape a { color: var(--bordo); text-decoration: none; }
    .rodape a:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* =========================================================
       COMPUTADOR — logo à esquerda, botões à direita
       ========================================================= */
    @media (min-width: 900px) {
      .linhas__cel { display: none; }
      .linhas__pc  { display: block; }

      .pagina {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr auto;
        align-items: center;
        justify-items: center;
        padding: 48px 6vw 32px;
        gap: 0 4vw;
      }
      .marca { grid-column: 1; grid-row: 1; }
      .marca img { width: min(440px, 32vw); }
      .links { grid-column: 2; grid-row: 1; max-width: 450px; padding: 22px; }
      .links ul { gap: 18px; }
      .botao { min-height: 54px; }
      .rodape { grid-column: 1 / -1; grid-row: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
